[workspace]
resolver = "2"
members = [
    "crates/wf_core",
    "crates/wf_assets",
    "crates/wf_sim",
    "crates/wf_client",
]

[workspace.package]
version = "3.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Bryan P. White"]

[workspace.dependencies]
# Core data & serialization
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"
anyhow = "1.0"
bytemuck = { version = "1.22", features = ["derive"] }

# Simulation & hexagonal topology
bevy_ecs = "0.15"
hexx = { version = "0.19", features = ["serde", "algorithms", "grid"] }
glam = { version = "0.29", features = ["serde", "bytemuck"] }
mint = "0.5.9"

# Asset ingestion & CLI
calamine = "0.35"
clap = { version = "4.5", features = ["derive"] }
dot_vox = "5.1"

# Native PC rendering, windowing, immediate-mode UI & spatial audio
wgpu = "30.0"
winit = "0.30"
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
kira = "0.12"
pollster = "0.4"
log = "0.4"

# Internal workspace crates
wf_core = { path = "crates/wf_core" }
wf_assets = { path = "crates/wf_assets" }
wf_sim = { path = "crates/wf_sim" }
